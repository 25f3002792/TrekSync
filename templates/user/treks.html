{% extends "base.html" %}
{% block content %}
<h2><i class="fas fa-hiking me-2" style="color: var(--secondary);"></i>Available Treks</h2>
<div class="card card-hover mb-3">
    <div class="card-body">
        <form method="GET" action="" class="row g-3">
            <div class="col-md-3">
                <input type="text" name="search" class="form-control" placeholder="Search by name" value="{{ search }}">
            </div>
            <div class="col-md-3">
                <select name="difficulty" class="form-select">
                    <option value="">All Difficulties</option>
                    <option value="Easy" {% if difficulty=='Easy' %}selected{% endif %}>Easy</option>
                    <option value="Moderate" {% if difficulty=='Moderate' %}selected{% endif %}>Moderate</option>
                    <option value="Hard" {% if difficulty=='Hard' %}selected{% endif %}>Hard</option>
                </select>
            </div>
            <div class="col-md-3">
                <input type="text" name="location" class="form-control" placeholder="Location" value="{{ location }}">
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-primary"><i class="fas fa-filter"></i> Filter</button>
            </div>
        </form>
    </div>
</div>

<div class="card card-hover">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead>
                    <tr><th>Name</th><th>Location</th><th>Difficulty</th><th>Duration</th><th>Slots</th><th>Action</th></tr>
                </thead>
                <tbody>
                    {% for trek in treks %}
                    <tr>
                        <td>{{ trek.name }}</td>
                        <td>{{ trek.location }}</td>
                        <td>{{ trek.difficulty }}</td>
                        <td>{{ trek.duration_days }} days</td>
                        <td>{{ trek.available_slots }}</td>
                        <td>
                            <form action="{{ url_for('user.book_trek', trek_id=trek.id) }}" method="POST">
                                <button type="submit" class="btn btn-sm btn-success" {% if trek.available_slots <=0 %}disabled{% endif %}>
                                    <i class="fas fa-calendar-plus"></i> Book
                                </button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
