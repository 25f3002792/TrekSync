{% extends "base.html" %}
{% block content %}
<h2><i class="fas fa-users me-2" style="color: var(--secondary);"></i>Participants for {{ trek.name }}</h2>
<div class="card card-hover">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-striped">
                <thead><tr><th>User</th><th>Email</th><th>Status</th></tr></thead>
                <tbody>
                    {% for booking in bookings %}
                    <tr>
                        <td>{{ booking.user.username }}</td>
                        <td>{{ booking.user.email }}</td>
                        <td><span class="badge bg-{{ 'success' if booking.status == 'Booked' else 'danger' }}">{{ booking.status }}</span></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
<a href="{{ url_for('staff.dashboard') }}" class="btn btn-secondary mt-3"><i class="fas fa-arrow-left"></i> Back</a>
{% endblock %}
